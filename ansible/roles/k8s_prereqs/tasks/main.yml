---
- name: Disable swap (Kubernetes requirement)
  command: swapoff -a
  become: true
  changed_when: false

- name: Remove swap entry from /etc/fstab (persist across reboots)
  lineinfile:
    path: /etc/fstab
    regexp: '^([^#].*\sswap\s.*)$'
    line: '# \1'
    backrefs: true
  become: true

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter
  become: true

- name: Persist kernel modules across reboots
  copy:
    content: |
      overlay
      br_netfilter
    dest: /etc/modules-load.d/k8s.conf
    mode: '0644'
  become: true

- name: Configure required sysctl params for Kubernetes networking
  copy:
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1
    dest: /etc/sysctl.d/k8s.conf
    mode: '0644'
  become: true

- name: Apply sysctl params
  command: sysctl --system
  become: true
  changed_when: false

- name: Add Kubernetes apt GPG key
  get_url:
    url: https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'
  become: true

- name: Add Kubernetes apt repository
  apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"
    state: present
    filename: kubernetes
  become: true

- name: Install kubelet, kubeadm, kubectl
  apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: yes
  become: true

- name: Hold Kubernetes packages at current version (avoid unexpected upgrades)
  dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  become: true

- name: Verify kubeadm installation
  command: kubeadm version
  register: kubeadm_version_output
  changed_when: false

- name: Show kubeadm version
  debug:
    var: kubeadm_version_output.stdout
