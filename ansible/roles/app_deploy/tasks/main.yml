---
- name: Create app directory on target host
  file:
    path: /home/ubuntu/app
    state: directory
    owner: ubuntu
    group: ubuntu
    mode: '0755'
  become: true

- name: Copy application source files
  copy:
    src: "{{ item }}"
    dest: /home/ubuntu/app/{{ item }}
    owner: ubuntu
    group: ubuntu
    mode: '0644'
  loop:
    - app.py
    - requirements.txt
    - Dockerfile

- name: Build Docker image
  community.docker.docker_image:
    name: capstone2-app
    tag: latest
    source: build
    build:
      path: /home/ubuntu/app
    force_source: true
  become: true

- name: Stop and remove any existing container (for redeploys)
  community.docker.docker_container:
    name: capstone2-app
    state: absent
  become: true
  ignore_errors: true

- name: Run the app container
  community.docker.docker_container:
    name: capstone2-app
    image: capstone2-app:latest
    state: started
    restart_policy: always
    ports:
      - "5000:5000"
  become: true

- name: Configure NGINX reverse proxy to the app container
  copy:
    content: |
      server {
          listen 80 default_server;
          server_name _;

          location /health {
              proxy_pass http://127.0.0.1:5000/health;
          }

          location / {
              proxy_pass http://127.0.0.1:5000/;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
          }
      }
    dest: /etc/nginx/sites-available/capstone2-app
    mode: '0644'
  become: true
  notify: Reload NGINX

- name: Enable the capstone2-app NGINX site
  file:
    src: /etc/nginx/sites-available/capstone2-app
    dest: /etc/nginx/sites-enabled/capstone2-app
    state: link
  become: true
  notify: Reload NGINX

- name: Remove default NGINX site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  become: true
  notify: Reload NGINX

- name: Flush handlers to apply NGINX config now
  meta: flush_handlers

- name: Wait for app to respond on health endpoint
  uri:
    url: http://localhost/health
    status_code: 200
  register: health_check
  retries: 5
  delay: 3
  until: health_check.status == 200

- name: Show health check result
  debug:
    var: health_check.json
